name: Reminder poll

# Serverless (Vercel) hosting has no persistent process, so the in-process node-cron scheduler
# (src/instrumentation.ts) disables itself on Vercel. This workflow is its replacement: it
# hits the already fail-closed /api/cron/reminders route on a schedule instead.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL      — this deployment's public base URL, e.g. https://cliain.example.com
#   CRON_SECRET  — same value as the CRON_SECRET env var set on the deployment

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/reminders
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${APP_URL}/api/cron/reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Reminder poll failed with status $status"
            exit 1
          fi
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
